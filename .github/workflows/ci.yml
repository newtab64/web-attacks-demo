name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Seed test databases
        run: npm run seed
      - name: Quality & Security checks (Typecheck, Lint, Format, Tests)
        run: npm run check
      - name: Security audit
        run: npm audit --audit-level=moderate
      - name: Build verification (Tailwind CSS)
        run: npm run build
